<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoverbike V2 - Babylon.js Psychedelic World</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0d021a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00f3ff;
            background: rgba(13, 2, 26, 0.75);
            border: 1px solid #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            padding: 15px 20px;
            border-radius: 8px;
            font-family: monospace;
            pointer-events: none;
            user-select: none;
            z-index: 10;
        }
        #hud h1 {
            margin: 0 0 8px 0;
            font-size: 18px;
            letter-spacing: 2px;
            color: #ff00aa;
            text-transform: uppercase;
        }
        #hud p {
            margin: 4px 0;
            font-size: 13px;
        }
        #hud .highlight {
            color: #ffff00;
            font-weight: bold;
        }
        #loadingOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d021a;
            color: #00f3ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            font-size: 20px;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        .spinner {
            border: 4px solid rgba(0, 243, 255, 0.2);
            border-top: 4px solid #ff00aa;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <!-- Babylon.js and GLTF Loader -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div>LOADING PSYCHEDELIC HOVERBIKE WORLD...</div>
    </div>

    <div id="hud">
        <h1>SABLE / SENNAAR HOVERBIKE</h1>
        <p>Controls: <span class="highlight">WASD</span> or <span class="highlight">Arrow Keys</span></p>
        <p>Speed: <span id="speedVal" class="highlight">0.00</span> u/s</p>
        <p>Status: <span id="statusVal" class="highlight">HOVERING</span></p>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script src="app.js"></script>
</body>
</html>
